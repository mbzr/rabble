name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://rabble:rabble@localhost:5432/rabble
      RABBLE_AWS_ACCESS_KEY_ID: ci-placeholder
      RABBLE_AWS_SECRET_ACCESS_KEY: ci-placeholder
      RABBLE_AWS_REGION: me-south-1
      RABBLE_S3_BUCKET: rabble-academy
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: ci-placeholder
      EMAIL_FROM: Rabble <ci@example.com>
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rabble
          POSTGRES_PASSWORD: rabble
          POSTGRES_DB: rabble_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rabble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:run
