name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://rabble:rabble@localhost:5432/rabble
      RABBLE_AWS_ACCESS_KEY_ID: ci-placeholder
      RABBLE_AWS_SECRET_ACCESS_KEY: ci-placeholder
      RABBLE_AWS_REGION: me-south-1
      RABBLE_S3_BUCKET: rabble-academy
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
