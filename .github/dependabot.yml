version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'drizzle-*' # pinned on purpose until dec
  - package-ecosystem: github-actions
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
